# NOTE: GitHub only runs workflows from the repository root's .github/workflows.
# This file is kept inside the mini-project to respect folder isolation; copy it to the repo root to enable CI.
name: ai-devmonitor
on:
  push:
    paths: ["ai-devmonitor/**"]
  pull_request:
    paths: ["ai-devmonitor/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-devmonitor/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ai-devmonitor/backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-devmonitor/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f ai-devmonitor/docker-compose.yml config -q
