services:
  docurag:
    build:
      context: .
      args:
        WITH_ANTHROPIC: "true"
    ports:
      - "8000:8000"
    environment:
      RAG_PROVIDER: ${RAG_PROVIDER:-extractive}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      RAG_API_KEY: ${RAG_API_KEY:-}
    volumes:
      - docurag-data:/data

  # Optional local LLM: `docker compose --profile ollama up`, then
  # `docker compose exec ollama ollama pull llama3.1` and set RAG_PROVIDER=ollama.
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  docurag-data:
  ollama-models:
