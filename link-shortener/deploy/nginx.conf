# Load balancer in front of two app instances. Both share Redis (cache, rate limits, click stream) and
# PostgreSQL, so any instance can serve any request and either one can write any click batch.
upstream snip {
    server app1:8080 max_fails=2 fail_timeout=5s;
    server app2:8080 max_fails=2 fail_timeout=5s;
    keepalive 64;
}

server {
    listen 80;
    client_max_body_size 64k;

    location / {
        proxy_pass http://snip;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, never append: the app trusts this header (TRUST_PROXY=true), so clients must not set it.
        proxy_set_header X-Real-IP $remote_addr;
        # Pass the country from a CDN in front (Cloudflare sets CF-IPCountry). Without such a CDN, clients could
        # spoof it; replace with: proxy_set_header CF-IPCountry "";
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
